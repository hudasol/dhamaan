  - {id: EV-02, title: "Hazard and risk assessment", status: open, rows: [A22, A28, A31, A37, B20]}
  - {id: EV-03, title: "Regime determination for an indoor robot in the assumed building", status: open, decision_needed: true, rows: [C47, C48, C49, C50, C51, C52, C53, C54, C55, C56, C64, C65, A01, B35, B17], note: "Not answerable from the sources found. See docs/UAE_ENQUIRY_PACK.md."}
