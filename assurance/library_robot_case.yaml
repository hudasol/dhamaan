# Machine checkable assurance case skeleton: university library service robot.
# ILLUSTRATIVE ONLY. The scenario was assumed for research purposes; it is not a real project.
# Every evidence item is OPEN. No evidence is claimed to exist. Nothing here is a certification claim.
# Source rows refer to data/evidence_table.csv (ids such as A22). A row supports vocabulary or method, not compliance.
meta:
  title: University library service robot, assurance case skeleton
  version: "0.2"
  status: skeleton, all evidence open
  evidence_table: data/evidence_table.csv
  note: "Rows listed under an evidence item are the sources that motivate it. They are not evidence that the robot meets anything."

assumptions:
  - id: AS1
    text: The scenario (a mobile service robot with learning based perception that fetches and returns books and guides visitors in a university library in the UAE) is assumed for illustration.
  - id: AS2
    text: An arm is optional. If no arm is fitted, goal G9 is removed.
  - id: AS3
    text: The library is an indoor, air conditioned space with daylight through glazing. This is my addition and has not been checked against any real building.
  - id: AS4
    text: No UAE rule specific to indoor ground service robots was found in the sources retrieved. This is a statement about the search, not about the law.

contexts:
  - id: C1
    text: Operational design domain (ODD) of the library. Layout, occupancy range, floors, lighting, network and localisation sources, and what is out of scope are to be defined.
    evidence: [EV-01]
  - id: C2
    text: System definition and user classes (children, elderly people, people with disabilities, staff).
    evidence: [EV-01]
  - id: C3
    text: Applicable regime for this deployment (UAE federal, emirate, university policy, insurer). Not yet determined.
    evidence: [EV-03]

strategies:
  - id: S1
    text: Argue over hazard classes taken from the risk assessment.
    evidence: [EV-02]

goals:
  - id: G1
    text: The library service robot is acceptably safe to operate in the defined university library ODD.
    context: [C1, C2, C3]
    assumptions: [AS1]
    supported_by: [S1, G10]
  - id: G2
    text: Collision and contact harm to people is controlled.
    context: [C1]
    evidence: [EV-04, EV-05, EV-06]
  - id: G3
    text: Learning based perception is adequate within the ODD.
    context: [C1]
    evidence: [EV-07, EV-09]
  - id: G4
    text: Navigation and planning failures end in a safe state or minimum risk behaviour.
    context: [C1]
    evidence: [EV-08, EV-09]
  - id: G5
    text: People, including vulnerable users, can predict, oversee and stop the robot.
    context: [C2]
    evidence: [EV-10, EV-13]
  - id: G6
    text: Building conditions (temperature, dust, glare) do not invalidate the evidence.
    context: [C1]
    assumptions: [AS3]
    evidence: [EV-12]
  - id: G7
    text: Software updates and cyber events do not undermine the safety claims.
    context: [C1]
    evidence: [EV-11, EV-18]
  - id: G8
    text: Field operation is monitored, and incidents are reported and learned from.
    context: [C3]
    evidence: [EV-14, EV-15]
  - id: G9
    text: Manipulator hazards are controlled, if an arm is fitted.
    context: [C1]
    assumptions: [AS2]
    undeveloped: true
    undeveloped_reason: Depends on the design. No manipulator is defined.
  - id: G10
    text: The argument itself is sound, with review, defeaters considered and confidence stated.
    evidence: [EV-16, EV-17]
  # strategy S1 supports G2..G9
strategy_links:
  S1: [G2, G3, G4, G5, G6, G7, G8, G9]

evidence:
  - {id: EV-01, title: "ODD and system definition", status: open, decision_needed: true, rows: [D11, D13, B46, B44, D05, C17], note: "Decision needed: the library layout, occupancy, user classes and lighting."}
  - {id: EV-02, title: "Hazard and risk assessment", status: open, rows: [A22, A28, A31, A37, B20]}
  - {id: EV-03, title: "Regime determination for an indoor robot in this university", status: open, decision_needed: true, rows: [C47, C48, C49, C50, C51, C52, C53, C54, C55, C56, C64, C65, A01, B35, B17], note: "Not answerable from the sources found. See docs/UAE_ENQUIRY_PACK.md."}
  - {id: EV-04, title: "Safety requirements and safety function specification", status: open, decision_needed: true, rows: [A35, A32, A33, A34, A31], note: "Decision needed: target integrity level."}
  - {id: EV-05, title: "Contact and collision evidence", status: open, decision_needed: true, rows: [A26, A29], note: "Decision needed: limits and their source."}
  - {id: EV-06, title: "Stopping distance and obstacle detection tests", status: open, rows: [A31, A36]}
  - {id: EV-07, title: "Perception evidence", status: open, rows: [B44, D18, D22, D21, B21]}
  - {id: EV-08, title: "Planning and navigation safety, minimum risk behaviour", status: open, rows: [B46, B09, C34], note: "GNSS loss is a drone analogue only; see docs/GULF_TEST_PROTOCOL.md."}
  - {id: EV-09, title: "Simulation credibility", status: open, decision_needed: true, rows: [B07, B45, D20, D27, D38], note: "Decision needed: credibility method."}
  - {id: EV-10, title: "Human interaction evidence", status: open, rows: [A38, B24, B25]}
