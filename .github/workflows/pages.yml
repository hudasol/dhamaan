name: pages
# Builds the static site from the repository data and publishes it with GitHub Pages.
# Runs on manual dispatch only, so nothing is published until the owner turns Pages on
# (Settings, Pages, Source: GitHub Actions) and starts this workflow.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free tools
        run: python -m pip install pyyaml numpy
      - name: Build the site from data
        run: python -m docsgen.site site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
