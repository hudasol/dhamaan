[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dhamaan"
version = "1.8.0"
description = "Source traced evidence base, checkable assurance case and preregistered simulation for robot and drone safety in Gulf conditions (student proposal seed, not certification)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml", "numpy"]
license = { file = "LICENSES.md" }
authors = [{ name = "Huda Mueen" }]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
dhamaan = "dhamaan.cli:main"

# Editable install only (python -m pip install -e .): the command reads tools/, data/ and assurance/ from the clone.
[tool.setuptools.packages.find]
include = ["dhamaan*", "sim*", "docsgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
